<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
  

<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
>

  
  <link rel="stylesheet" href="style.css">


  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <title>Frontend Mentor | Blog preview card</title>

</head>

<body>

  <main class="container min-vh-100 d-flex align-items-center">
  <div class="row justify-content-center w-100">
    <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">
    
<article class="card p-4">
  <img
    src="./assets/images/illustration-article.svg"
    class="card-img-top rounded-3"
    alt="Colorful illustration representing HTML and CSS"
  >

  <div class="card-body px-0 pb-0">
    <span class="tag d-inline-block fw-bold px-3 py-1 rounded-1">
      Learning
    </span>

    <p class="date mt-3 mb-2">Published 21 Dec 2023</p>

    <h1 class="card-title fw-bold">
      HTML &amp; CSS foundations
    </h1>

    <p class="card-text desc">
      These languages are the backbone of every website,
      defining structure, content, and presentation.
    </p>

    <div class="author d-flex align-items-center gap-3 mt-4">
      <img
        src="./assets/images/image-avatar.webp"
        alt="Greg Hooper"
        width="32"
        height="32"
      >
      <span class="fw-bold">Greg Hooper</span>
    </div>
  </div>
</article>
    </div>
  </div>
  </main>
  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Fatima Edmonds</a>.
  </footer>
</body>
</html>
